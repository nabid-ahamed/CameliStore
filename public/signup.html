<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CameliStore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: var(--color-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, rgba(0,0,0,0.03) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0,0,0,0.03) 0%, transparent 40%);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 3rem;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: var(--transition);
        }

        .auth-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.12);
        }

        .auth-container h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            text-align: center;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--color-text-muted);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: #333;
        }

        .form-control {
            height: 52px;
            border-radius: 12px;
            background: #f9f9f9;
            border: 1px solid transparent;
            padding: 0 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: #000;
            box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
        }

        .btn-primary {
            height: 52px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            background: #000;
            margin-top: 1rem;
            transition: var(--transition);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>
    <header>
        <div class="container nav-container">
            <a href="/" class="logo" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
                <img src="/images/logo.png" alt="Logo" style="height: 32px; margin-right: 10px;">
                CameliStore.
            </a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join CameliStore for an exclusive shopping experience</p>
            <form id="signup-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required minlength="4">
                </div>
                <div id="error-msg" style="color: red; margin-bottom: 1rem; display: none;"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
                <p style="text-align: center; margin-top: 1rem;">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const errEl = document.getElementById('error-msg');
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
